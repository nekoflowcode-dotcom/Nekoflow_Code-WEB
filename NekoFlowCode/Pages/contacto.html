<!-- 4. SECCIÓN CONTACTO -->
<section id="contacto" class="contact-section" aria-labelledby="contacto-titulo">
    <div class="container">
        <div class="contact_in">
            <div class="contact_form">
                <h2 id="contacto-titulo">¿Tenés un proyecto en mente?</h2>

                <form id="email-form" novalidate>
                    <!-- Campo Nombre -->
                    <label class="contact_form-lbl" for="name">Nombre completo</label>
                    <input class="contact_form-text" type="text" id="name" name="name" placeholder="Tu nombre..."
                        autocomplete="name" required minlength="3">

                    <!-- Campo Email -->
                    <label class="contact_form-lbl" for="email">Correo electrónico</label>
                    <input class="contact_form-text" type="email" id="email" name="email"
                        placeholder="tucorreo@email.com" autocomplete="email" required>

                    <!-- Campo Mensaje -->
                    <label class="contact_form-lbl" for="message">Mensaje</label>
                    <textarea class="contact_form-textarea" id="message" name="message"
                        placeholder="Contanos sobre tu proyecto..." required minlength="10"></textarea>

                    <!-- CAMPO TRAMPA (HONEYPOT) - OCULTO PARA HUMANOS -->
                    <div style="display: none;" aria-hidden="true">
                        <label for="website-trap">No completar este campo:</label>
                        <input type="text" id="website-trap" name="website-trap" tabindex="-1" autocomplete="off">
                    </div>

                    <!-- WIDGET DE RECAPTCHA V2 -->
                    <div class="recaptcha-container" style="margin: 20px 0;">
                        <div class="g-recaptcha" data-sitekey="6LfOSuwtAAAAAJFqYICX-EDvJfA1IPgXHwRmajBW"></div>
                    </div>

                    <!-- Contenedor para mensajes de estado/error -->
                    <div id="form-status" class="form-status-msg" aria-live="polite"></div>

                    <!-- Botón de Envío -->
                    <button class="contact_form-btn" type="submit" id="submit-btn">
                        Enviar Mensaje
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
