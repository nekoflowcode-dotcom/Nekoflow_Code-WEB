<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ======================================================= -->
    <!-- 1. SEO BÁSICO (Para motores de búsqueda como Google)    -->
    <!-- ======================================================= -->

    <!-- Título principal que aparece en la pestaña del navegador y resultado de búsqueda -->
    <title>NekoFlow Code | Desarrollo Web & Soluciones Digitales</title>

    <!-- Descripción resumida que Google muestra en los resultados de búsqueda (máx. ~160 caracteres) -->
    <meta name="description"
        content="Nekoflow Code - Soluciones digitales modernas, desarrollo web profesional, diseño UI/UX y software a medida para impulsar tu negocio.">

    <!-- Palabras clave asociadas al rubro de la agencia para indexación -->
    <meta name="keywords"
        content="Desarrollo Web, Diseño Web, Programación, Soluciones Digitales, Nekoflow Code, Software a medida">

    <!-- Indica el creador o la empresa responsable del sitio -->
    <meta name="author" content="Nekoflow Code">

    <!-- Le indica a los bots de búsqueda que indexen la página y sigan los enlaces de la misma -->
    <meta name="robots" content="index, follow">

    <!-- ======================================================= -->
    <!-- 2. OPEN GRAPH / REDES SOCIALES                          -->
    <!-- (Para vistas previas automáticas en WhatsApp, LinkedIn) -->
    <!-- ======================================================= -->

    <!-- Define el tipo de contenido que representa la URL -->
    <meta property="og:type" content="website">

    <!-- Título que se muestra en la tarjeta al compartir el link en chats o publicaciones -->
    <meta property="og:title" content="NekoFlow Code | Desarrollo Web & Soluciones Digitales">

    <!-- Bajada o subtítulo explicativo de la tarjeta visual -->
    <meta property="og:description"
        content="Creamos soluciones digitales modernas, funcionales y adaptadas a las necesidades de cada proyecto.">

    <!-- URL oficial del sitio web que se asocia a la tarjeta -->
    <meta property="og:url" content="https://nekoflowcode.github.io/">

    <!-- Imagen en miniatura que acompaña al mensaje al enviar el link (Banner/Logo) -->
    <meta property="og:image" content="https://nekoflowcode.github.io/assets/banner.png">


    <!-- ======================================================= -->
    <!-- 3. HOJAS DE ESTILOS CSS                                 -->
    <!-- ======================================================= -->
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/circuleabout.css">
    <link rel="stylesheet" href="./css/contact-form.css">
    <link rel="stylesheet" href="./css/sticky-buttons.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/card-service.css">
    <link rel="stylesheet" href="./css/hero-section.css">
</head>

<body>
    <!-- BOTONES FLOTANTES LATERALES -->
    <div class="sticly-social-container">
        <ul class="sticly-social">
            <li>
                <a href="https://github.com/nekoflowcode" target="_blank" rel="noopener">
                    <p>GitHub</p>
                    <i class="fab fa-github"></i>
                </a>
            </li>
        </ul>
    </div>

    <!-- CONTENIDO PRINCIPAL CARGADO DINÁMICAMENTE -->
    <main class="main-content">
        <div id="inicio-container"></div>
        <div id="nosotros-container"></div>
        <div id="servicios-container"></div>
        <div id="proyecto-container"></div>
        <div id="contacto-container"></div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        <p class="footer_copy-text">
            &copy; <span id="current-year"></span> Nekoflow Code. Todos los derechos reservados.
        </p>
    </footer>

    <!-- Scripts de Funcionalidad -->
    <script src="./js/load-components.js" defer></script>
    <script src="./js/footer-copy.js" defer></script>
</body>

</html>
